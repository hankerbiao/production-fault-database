<style>

3;background:#fff;padding:8px 12px;border-radius:6px;color:#55756c;font-size:12px}.overview{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:18px}.metric,.panel{background:#fff;border:1px solid var(--line);border-radius:9px}.metric{padding:17px 20px;display:flex;justify-content:space-between;align-items:center}.metric-label{color:#87969a;font-size:12px;margin-bottom:7px}.metric-value{font-size:21px;font-weight:600}.metric-icon{width:40px;height:40px;display:grid;place-items:center;border-radius:10px;background:#eef7f3;color:#168c78;font-size:20px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:18px;align-items:start}.stack{display:grid;gap:18px}.panel{overflow:hidden}.panel-header{padding:20px 22px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid #edf1ef}.panel-header h2{font-size:15px;font-weight:650}.panel-header p{color:var(--muted);font-size:12px;margin-top:4px}.panel-body{padding:20px 22px}.section-kicker{color:#95a5a3;font-size:11px;font-weight:600;letter-spacing:1px;margin-bottom:12px}.task-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:20px}.task-option{display:flex;align-items:center;gap:8px;padding:10px 11px;border:1px solid #e8eeee;border-radius:6px;color:#465c60;cursor:pointer}.task-option input{accent-color:var(--green)}.field-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.field label{display:block;font-size:12px;color:#6f8184;margin-bottom:7px}.layui-input,.layui-select{height:38px;border-color:#dce7e4;border-radius:5px}.layui-input:focus{border-color:#63ab9c!important}.layui-btn{border-radius:5px;background-color:var(--green)}.layui-btn-primary{background:white;color:#526762;border-color:#dce7e4}.action-row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:21px;padding-top:18px;border-top:1px solid #edf1ef}.tip{color:#8b9b9b;font-size:12px}.table-wrap{overflow:auto}.layui-table{margin:0;font-size:13px;min-width:600px}.layui-table th{font-weight:500;color:#899b9a;background:#fafcfb;font-size:12px}.layui-table td,.layui-table th{border-color:#edf1ef;padding:11px 13px}.layui-table td{color:#4b6061}.schedule-times{min-width:150px}.schedule-toggle{accent-color:var(--green);width:16px;height:16px}.schedule-footer{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-top:17px}.queue{font-size:12px;color:#839491}.tag{display:inline-block;border-radius:4px;padding:3px 7px;background:#edf7f3;color:#2b8d71;font-size:11px}.tag.failed{background:#fff1ed;color:#c8664d}.tag.running{background:#edf5ff;color:#417cbc}.stage-button{border:0;background:#f2f6f4;color:#527069;padding:5px 8px;border-radius:4px;margin:3px 3px 3px 0;cursor:pointer;font-size:12px}.stage-button:hover{color:var(--green);background:#e7f4ee}.launch-item{display:block;border:0;border-bottom:1px solid #eef2f0;background:white;padding:11px 0;width:100%;text-align:left;color:#506b67;cursor:pointer;overflow-wrap:anywhere;font-size:12px}.launch-item:last-child{border:0}.log{background:#172b2c;color:#bed2c8;white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.7 ui-monospace,monospace;padding:16px;min-height:150px;max-height:400px;overflow:auto;border-radius:6px}.notice{display:none;color:#a54330;background:#fff3ef;border:1px solid #f5d7ce;border-radius:6px;padding:10px 13px;margin-bottom:16px}.empty{color:#a0afad;padding:15px 0;font-size:12px}.footer{padding-top:22px;color:#a1b0ad;font-size:11px}.layui-layer-btn .layui-layer-btn0{background:var(--green)!important;border-color:var(--green)!important}@media(max-width:1050px){.layout{grid-template-columns:1fr}.sidebar{width:180px}.main{margin-left:180px;width:calc(100% - 180px)}}@media(max-width:700px){.sidebar{display:none}.main{margin:0;width:100%}.topbar{padding:0 18px}.workspace{padding:25px 16px}.overview{grid-template-columns:1fr;gap:8px}.metric{padding:12px 15px}.field-row{grid-template-columns:1fr}.heading{align-items:start;flex-direction:column}.task-grid{grid-template-columns:1fr}.top-right span:first-child{display:none}}

/* A single workspace keeps configuration and recent activity together. */
.app{display:block}.main{width:100%;margin:0}.topbar{height:58px;padding:0 28px}.workspace{max-width:1500px;padding:24px 28px 48px}.heading{margin:0 0 18px}.heading h1{font-size:23px}.layout{grid-template-columns:minmax(0,1fr) 330px}.panel-header{padding:16px 20px 13px}.panel-body{padding:15px 20px}.task-grid{grid-template-columns:repeat(3,minmax(0,1fr));margin-bottom:14px}.action-row{margin-top:14px;padding-top:12px}.layui-table{min-width:700px}.data-time{white-space:nowrap;font-variant-numeric:tabular-nums;color:#526a68}.data-time small{display:block;color:#93a29e;font-size:11px}.schedule-times{min-width:150px}.manual-layout{display:grid;grid-template-columns:minmax(0,1fr) 1.1fr;gap:20px;align-items:end}.manual-layout .task-grid{margin:0}.manual-layout .action-row{border:0;padding:0;margin:12px 0 0}.manual-layout .field-row{grid-template-columns:repeat(3,minmax(0,1fr))}@media(max-width:1050px){.layout{grid-template-columns:1fr}.manual-layout{grid-template-columns:1fr}}@media(max-width:700px){.workspace{padding:20px 14px}.task-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.manual-layout .field-row{grid-template-columns:1fr}.topbar{padding:0 16px}}
body{font-size:13px}.topbar{height:46px}.workspace{max-width:1380px;padding:16px 22px 32px}.heading{margin-bottom:12px}.heading h1{font-size:20px;margin-bottom:3px}.status-chip{padding:5px 9px}.layout,.stack{gap:12px}.layout{grid-template-columns:minmax(0,1fr) 290px}.panel-header{padding:11px 14px 9px}.panel-header h2{font-size:14px}.panel-body{padding:11px 14px}.section-kicker{margin-bottom:7px}.task-grid{gap:5px}.task-option{padding:6px 8px}.manual-layout{gap:14px}.field label{margin-bottom:4px}.layui-input,.layui-select{height:32px}.layui-table td,.layui-table th{padding:6px 9px}.schedule-footer{margin-top:10px}.launch-item{padding:7px 0}.log{padding:12px;min-height:110px;max-height:320px}.footer{padding-top:12px}@media(max-width:1050px){.layout{grid-template-columns:1fr}}@media(max-width:700px){.workspace{padding:16px 12px}}

.layout{grid-template-columns:minmax(0,1fr) 360px}.run-list{padding:0 15px}.run-item{padding:12px 0;border-bottom:1px solid #edf1ef}.run-item:last-child{border-bottom:0}.run-top{display:flex;justify-content:space-between;align-items:center;gap:8px}.run-time{font-weight:600;color:#314744;font-variant-numeric:tabular-nums}.run-meta,.run-stages,.run-message{margin-top:6px;color:#7b8f8a;font-size:12px;line-height:1.6;overflow-wrap:anywhere}.run-message{color:#a35b4d}.run-actions{margin-top:7px}@media(max-width:1100px){.layout{grid-template-columns:1fr}}

.time-options{display:flex;flex-wrap:wrap;gap:4px;min-width:210px}.time-option{border:1px solid #dce7e4;background:#fff;color:#748782;border-radius:4px;padding:4px 6px;font-size:12px;line-height:1.2;cursor:pointer;font-variant-numeric:tabular-nums}.time-option[aria-pressed="true"]{background:#e5f4ee;color:#087d6d;border-color:#a8d7c5}.time-option:focus-visible{outline:2px solid #087d6d;outline-offset:2px}

.time-custom-toggle,.time-custom-add{border:1px dashed #a8cfc1;background:#f8fcfa;color:#087d6d;border-radius:4px;padding:4px 7px;font-size:12px;cursor:pointer}.time-custom{display:flex;align-items:center;gap:4px;flex-basis:100%;margin-top:3px}.time-custom[hidden]{display:none}.time-custom select{height:26px;border:1px solid #dce7e4;border-radius:4px;background:#fff;color:#314744;font-size:12px}
.data-time small.data-error{color:#bd5743;white-space:normal;max-width:220px;line-height:1.45;margin-top:3px}
</style></head>
<body><div class="app"><main class="main"><header class="topbar"><div>数据服务 <span style="padding:0 9px;color:#ced8d5">/</span> <strong>同步管理</strong></div><div class="top-right"><span>运行时间 · 北京时间</span><span><i class="layui-icon layui-icon-user"></i> 管理员</span></div></header><div class="workspace" id="overview"><div class="heading"><div><h1>数据同步管理</h1><p>管理数据源同步计划，查看任务执行情况。</p></div><div class="status-chip"><span class="dot"></span>服务已连接</div></div><div id="error" class="notice" role="alert"></div>
<div class="layout"><div class="stack"><section class="panel" id="schedule"><div class="panel-header"><div><h2>自动调度</h2><p>为每个数据源单独设置每日运行时间</p></div><span class="tag">北京时间</span></div><div class="panel-body"><div class="table-wrap"><table class="layui-table" lay-skin="line"><thead><tr><th><input id="select-all" type="checkbox" aria-label="全选数据源"></th><th>数据源</th><th>最新数据时间</th><th>执行时间 · 点击选择或自定义</th><th>操作</th></tr></thead><tbody id="schedules"></tbody></table></div><div class="schedule-footer"><span id="queue" class="queue"></span><div><button id="run-selected" type="button" class="layui-btn layui-btn-sm">立即同步</button><button id="save" class="layui-btn layui-btn-sm">保存配置</button></div></div><p class="tip" style="margin-top:12px">每天执行，包含周末；同一时刻的任务会合并，运行中任务会排队。</p></div></section>
</div><div class="stack"><section class="panel" id="history"><div class="panel-header"><div><h2>最近运行</h2><p>最近 24 小时的执行记录</p></div><div><button id="more" class="layui-btn layui-btn-primary layui-btn-sm">更多</button><button id="refresh" class="layui-btn layui-btn-primary layui-btn-sm"><i class="layui-icon layui-icon-refresh"></i> 刷新</button></div></div><div id="runs" class="run-list"></div></section></div></div></div></main></div>
<script src="/static/layui/layui.js"></script><script>
const $=id=>document.getElementById(id);
async function api(path,options={}){const r=await fetch(path,{...options,headers:{'Content-Type':'application/json'}});const data=await r.json();if(!r.ok)throw Error(data.detail||'请求失败');return data}
function error(e){$('error').textContent=e.message||String(e);$('error').style.display='block'}
function clearError(){$('error').style.display='none'}
function formatTime(value){const raw=String(value);const date=new Date(raw.endsWith('Z')||/[+-]\d\d:\d\d$/.test(raw)?raw:raw+'Z');return Number.isNaN(date.getTime())?raw:date.toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false})}
function renderRuns(container,runs){container.replaceChildren();if(!runs.length){const empty=document.createElement('div');empty.className='empty';empty.textContent='暂无运行记录';container.append(empty)}for(const run of runs){const item=document.createElement('article');item.className='run-item';const top=document.createElement('div');top.className='run-top';const date=document.createElement('span');date.className='run-time';date.textContent=run.started_at?formatTime(run.started_at):'时间未知';const state=document.createElement('span');state.className=`tag ${run.state==='failed'?'failed':run.state==='running'?'running':''}`;state.textContent=({success:'成功',failed:'失败',running:'运行中',abandoned:'已中断'})[run.state]||run.state||'未知';top.append(date,state);item.append(top);const meta=document.createElement('div');meta.className='run-meta';meta.textContent=`${run.mode==='incremental'?'增量':run.mode==='full'?'全量':run.mode||'—'} · ${run.source||'未知来源'}`;item.append(meta);const stages=document.createElement('div');stages.className='run-stages';stages.textContent=(run.stages||[]).map(stage=>{const reason=stage.state==='failed'?(typeof stage.error==='string'?stage.error:stage.error?.message)||stage.message:'';return `${stage.label||stage.task_id}（${({success:'成功',failed:'失败',running:'运行中',skipped:'跳过',pending:'等待',retrying:'重试中'})[stage.state]||stage.state||'未知'}${reason?'：'+reason:''}）`}).join('、')||'暂无任务详情';item.append(stages);if(run.message&&run.state!=='success'){const message=document.createElement('div');message.className='run-message';message.textContent=run.message;item.append(message)}if(['failed','abandoned'].includes(run.state)){const actions=document.createElement('div');actions.className='run-actions';const button=document.createElement('button');button.className='layui-btn layui-btn-primary layui-btn-xs';button.textContent='重试';button.onclick=async()=>{try{await api(`/api/runs/${encodeURIComponent(run._id)}/retry`,{method:'POST'});layui.layer.msg('已提交重试');await load()}catch(e){error(e)}};actions.append(button);item.append(actions)}container.append(item)}}
function cell(row,text){const el=document.createElement('td');el.textContent=text??'—';row.append(el);return el}
let dataTimesLoading=false;
async function refreshDataTimes(){if(dataTimesLoading)return;dataTimesLoading=true;try{const result=await api('/api/data-times');for(const row of $('schedules').rows){const value=result.items[row.dataset.taskId], target=row.querySelector('.data-time');target.replaceChildren();const text=document.createElement('span');text.textContent=value?.error?'读取失败':value?.time?formatTime(value.time):'暂无数据';target.append(text);if(value?.error){const reason=document.createElement('small');reason.className='data-error';reason.textContent=typeof value.error==='string'?value.error:'无法读取最新数据时间';target.append(reason)}if(value?.kind==='success'){const note=document.createElement('small');note.textContent='最近成功完成';target.append(note)}}}catch(e){for(const row of $('schedules').rows)row.querySelector('.data-time').textContent='读取失败'}finally{dataTimesLoading=false}}
async function load(){try{
const [tasks,schedule,queue]=await Promise.all([api('/api/tasks'),api('/api/schedule'),api('/api/schedule/queue')]);

$('queue').textContent=queue.items.length?`等待执行 ${queue.items.length} 项：${queue.items.map(x=>x.slot+' '+x.taskIds.join('、')).join('；')}`:'当前没有等待执行的任务';
if(!$('schedules').children.length){for(const t of tasks.items){const item=schedule.items.find(x=>x.taskId===t.id),row=document.createElement('tr');row.dataset.taskId=t.id;const select=document.createElement('input');select.type='checkbox';select.className='task-select';select.setAttribute('aria-label',`选择${t.label}`);select.onchange=()=>{$('select-all').checked=[...$('schedules').querySelectorAll('.task-select')].every(input=>input.checked)};cell(row,'').append(select);cell(row,t.label);const dataTime=cell(row,'读取中');dataTime.className='data-time';const defaults=['08:00','12:00','15:00','18:00','22:00'], saved=item ? (item.times || []) : defaults, selected=saved, enabled=item?.enabled ?? true;const times=document.createElement('div');times.className='time-options';times.setAttribute('role','group');times.setAttribute('aria-label',`${t.label}同步时间`);function addTime(time,checked){let option=[...times.querySelectorAll('.time-option')].find(button=>button.dataset.time===time);if(option){option.setAttribute('aria-pressed',String(checked));return}option=document.createElement('button');option.type='button';option.className='time-option';option.textContent=time;option.dataset.time=time;option.setAttribute('aria-pressed',String(checked));option.onclick=()=>option.setAttribute('aria-pressed',String(option.getAttribute('aria-pressed')!=='true'));times.insertBefore(option,times.querySelector('.time-custom-toggle'))}for(const time of [...new Set([...defaults,...saved])].sort())addTime(time,selected.includes(time));const toggle=document.createElement('button');toggle.type='button';toggle.className='time-custom-toggle';toggle.textContent='+ 自定义';toggle.setAttribute('aria-expanded','false');const custom=document.createElement('div');custom.className='time-custom';custom.hidden=true;const hour=document.createElement('select'),minute=document.createElement('select');hour.setAttribute('aria-label',`${t.label}自定义小时`);minute.setAttribute('aria-label',`${t.label}自定义分钟`);for(let i=0;i<24;i++){const option=document.createElement('option');option.value=String(i).padStart(2,'0');option.textContent=option.value+'时';hour.append(option)}for(let i=0;i<60;i++){const option=document.createElement('option');option.value=String(i).padStart(2,'0');option.textContent=option.value+'分';minute.append(option)}const add=document.createElement('button');add.type='button';add.className='time-custom-add';add.textContent='添加';add.onclick=()=>{addTime(`${hour.value}:${minute.value}`,true);custom.hidden=true;toggle.setAttribute('aria-expanded','false')};toggle.onclick=()=>{custom.hidden=!custom.hidden;toggle.setAttribute('aria-expanded',String(!custom.hidden))};custom.append(hour,minute,add);times.append(toggle,custom);const enabledToggle=document.createElement('label');enabledToggle.style.cssText='display:flex;align-items:center;gap:5px;margin-top:5px;color:#6f8184;font-size:12px';const enabledInput=document.createElement('input');enabledInput.type='checkbox';enabledInput.className='schedule-enabled';enabledInput.checked=enabled;enabledInput.setAttribute('aria-label',`启用${t.label}自动调度`);enabledToggle.append(enabledInput,document.createTextNode('启用'));const timeCell=cell(row,'');timeCell.append(times,enabledToggle);const button=document.createElement('button');button.className='layui-btn layui-btn-primary layui-btn-sm';button.textContent='手动同步';button.setAttribute('aria-label',`手动同步${t.label}`);button.onclick=()=>layui.layer.confirm(`确认对 ${t.label} 执行增量同步？`,{icon:3,title:'手动同步'},async index=>{layui.layer.close(index);try{button.disabled=true;const result=await api('/api/runs',{method:'POST',body:JSON.stringify({mode:'incremental',taskIds:[t.id]})});layui.layer.msg(`已提交：${result.runId}`);setTimeout(load,1500)}catch(e){error(e)}finally{button.disabled=false}});cell(row,'').append(button);$('schedules').append(row)}}
refreshDataTimes();
try{const runs=await api('/api/runs/recent');renderRuns($('runs'),runs.items);clearError()}catch(e){error(e)}
}catch(e){error(e)}}
$('more').onclick=()=>{let page=0;const wrapper=document.createElement('div');wrapper.style.padding='16px 20px';const list=document.createElement('div');list.style.maxHeight='60vh';list.style.overflow='auto';const controls=document.createElement('div');controls.style.cssText='display:flex;align-items:center;justify-content:space-between;margin-top:14px';const prev=document.createElement('button'),next=document.createElement('button'),label=document.createElement('span');prev.className=next.className='layui-btn layui-btn-primary layui-btn-sm';prev.textContent='上一页';next.textContent='下一页';controls.append(prev,label,next);wrapper.append(list,controls);async function fetchPage(){try{const result=await api(`/api/runs?limit=10&offset=${page*10}`);renderRuns(list,result.items);label.textContent=`第 ${page+1} 页`;prev.disabled=page===0;next.disabled=!result.hasMore;list.scrollTop=0}catch(e){error(e)}}prev.onclick=()=>{if(page>0){page--;fetchPage()}};next.onclick=()=>{page++;fetchPage()};layui.layer.open({type:1,title:'历史运行记录',area:['min(760px, 94vw)','auto'],content:wrapper});fetchPage()};
$('select-all').onchange=event=>{for(const input of $('schedules').querySelectorAll('.task-select'))input.checked=event.target.checked};
$('run-selected').onclick=async()=>{const button=$('run-selected');const taskIds=[...$('schedules').rows].filter(row=>row.querySelector('.task-select')?.checked).map(row=>row.dataset.taskId);if(!taskIds.length){error(new Error('请先勾选需要同步的数据源'));return}try{button.disabled=true;clearError();const result=await api('/api/runs',{method:'POST',body:JSON.stringify({mode:'incremental',taskIds})});layui.layer.msg(`已提交同步：${result.runId}`);setTimeout(load,1500)}catch(e){error(e)}finally{button.disabled=false}};
$('save').onclick=async()=>{try{const items=[...$('schedules').rows].map(row=>({taskId:row.dataset.taskId,enabled:row.querySelector('.schedule-enabled').checked,times:[...row.querySelectorAll('.time-option[aria-pressed="true"]')].map(button=>button.dataset.time)}));await api('/api/schedule',{method:'PUT',body:JSON.stringify({items})});clearError();layui.layer.msg('调度配置已保存');await load()}catch(e){error(e)}};$('refresh').onclick=load;load();setInterval(load,10000);
</script></body></html>
